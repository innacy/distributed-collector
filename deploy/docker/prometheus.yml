global:
  scrape_interval: 15s

scrape_configs:
  # DNS discovery so every replica (deploy.replicas: 2) is scraped, not one at random.
  - job_name: "pipeline-services"
    dns_sd_configs:
      - names: ["validator", "enricher", "aggregator", "raw-store-writer"]
        type: A
        port: 8081
        refresh_interval: 15s
