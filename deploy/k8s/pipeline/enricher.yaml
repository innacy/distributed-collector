apiVersion: apps/v1
kind: Deployment
metadata:
  name: enricher
  namespace: distributed-collector
  labels:
    app: enricher
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enricher
  template:
    metadata:
      labels:
        app: enricher
    spec:
      containers:
        - name: enricher
          image: distributed-collector-enricher:latest
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: SERVICE_NAME
              value: "enricher"
            - name: CONSUMER_GROUP
              value: "enricher-group"
            - name: INPUT_TOPIC
              value: "validated-logs"
            - name: OUTPUT_TOPIC
              value: "enriched-logs"
            - name: DLQ_TOPIC
              value: "dlq-enrich-failed"
            - name: SERVICE_REGISTRY_PATH
              value: "/configs/service-registry.yaml"
            - name: HTTP_PORT
              value: "8081"
          ports:
            - containerPort: 8081
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enricher-hpa
  namespace: distributed-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enricher
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: pipeline_consumer_lag
        target:
          type: AverageValue
          averageValue: "10000"
