apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: distributed-collector
  labels:
    app: aggregator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      containers:
        - name: aggregator
          image: distributed-collector-aggregator:latest
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: SERVICE_NAME
              value: "aggregator"
            - name: CONSUMER_GROUP
              value: "aggregator-group"
            - name: INPUT_TOPIC
              value: "enriched-logs"
            - name: FLUSH_INTERVAL_SEC
              value: "10"
            - name: HTTP_PORT
              value: "8081"
          ports:
            - containerPort: 8081
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aggregator-hpa
  namespace: distributed-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aggregator
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: pipeline_consumer_lag
        target:
          type: AverageValue
          averageValue: "10000"
